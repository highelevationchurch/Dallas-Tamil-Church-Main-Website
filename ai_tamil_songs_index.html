<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Tamil Songs Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:700,400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="menu-bar-placeholder"></div>

<div class="container-fluid main">
    <div class="row">
        <div class="col-lg-12">
            <div class="center-block">
                <h2>AI Tamil Songs Index</h2>
                <p>
                  <button class="btn btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNote" aria-expanded="false" aria-controls="collapseNote">
                    AI Note
                  </button>
                </p>
                <div class="collapse" id="collapseNote">
                  <div class="card card-body">
                    This index automatically includes all files scripted and uses AI for language detection.
                  </div>
                </div>
                <div class="alpha-nav-container"></div>
                <div id="song-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Fetch and insert menu bar
        fetch('../menu_bar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-bar-placeholder').innerHTML = data;
            });

        // Fetch and insert footer
        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        // Fetch and process song list
        fetch('../ai_tamil_songs_index.json')
            .then(response => response.json())
            .then(data => {
                const songListContainer = document.getElementById('song-list');
                const songsByLetter = {};

                data.forEach(fileName => {
                    const title = fileName.replace('.html', '').replace(/([A-Z])/g, ' $1').trim();
                    const firstLetter = title.charAt(0).toUpperCase();
                    if (!songsByLetter[firstLetter]) {
                        songsByLetter[firstLetter] = [];
                    }
                    songsByLetter[firstLetter].push({ title, fileName });
                });

                const sortedLetters = Object.keys(songsByLetter).sort();

                // Create alphabet navigation
                const navContainer = document.querySelector('.alpha-nav-container');
                let navHtml = '|';
                for (const char of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
                    navHtml += ` <a href="#${char.toLowerCase()}list">${char}</a> |`;
                }
                navContainer.innerHTML = navHtml;


                let html = '';
                sortedLetters.forEach(letter => {
                    html += `<h3 id="${letter.toLowerCase()}list">${letter}</h3><ul>`;
                    songsByLetter[letter].forEach(song => {
                        html += `<li><a href="../Songs/${song.fileName}" target="_blank">${song.title}</a></li>`;
                    });
                    html += `</ul>`;
                });

                songListContainer.innerHTML = html;
            });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
