        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>
            // Event delegation for dynamically loaded submenu toggles
            document.addEventListener('click', function(e) {
                const toggle = e.target.closest('.dropdown-submenu a.dropdown-toggle');
                if (toggle) {
                    e.preventDefault();
                    e.stopPropagation();
                    let submenu = toggle.nextElementSibling;
                    if (submenu) {
                        submenu.classList.toggle('show');
                    }
                }

                // Close submenus when clicking outside
                // Check if the clicked element is inside a dropdown or dropdown-menu
                let isClickInsideDropdown = e.target.closest('.dropdown') || e.target.closest('.dropdown-menu') || e.target.closest('.dropdown-submenu');

                if (!isClickInsideDropdown) {
                    document.querySelectorAll('.dropdown-submenu .dropdown-menu.show').forEach(function(submenu) {
                        submenu.classList.remove('show');
                        submenu.parentNode.classList.remove('show');
                    });
                }
            });
        </script>
