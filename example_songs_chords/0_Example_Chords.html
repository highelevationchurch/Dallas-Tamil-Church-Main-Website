            chordSheet: {

        /**
         * Detects if a line consists mostly of chords and formats it.
         * @param {string} line The line to process.
         * @returns {string} The formatted HTML line.
         */
        function formatChordsInLine(line) {
            // Regex to test if a single word is a chord, allowing for trailing punctuation.
            const chordWordPattern = /^[ABCDEFG][#b]?(?:m|sus|add|maj|min|dim|aug)?\d*(?:\/[ABCDEFG][#b]?)?\W*$/;
            
            // Split on whitespace and remove any empty strings that result from multiple spaces.
            const words = line.trim().split(/\s+/).filter(w => w);

            if (words.length === 0) {
                return line; // It's a blank line, return as is.
            }

            let chordCount = 0;
            for (const word of words) {
                if (chordWordPattern.test(word)) {
                    chordCount++;
                }
            }
            
            // A line is considered a "chord line" if more than half of its "words" are chords.
            if (chordCount / words.length > 0.5) {
                return `<span style="color: red">${line}</span>`;
            }
            
            return line;
        }

        /**
         * Converts the raw text content to formatted HTML.
         * @param {string} content The raw string content.
         * @returns {string} The formatted HTML markup.
         */
        function generateChordMarkup(content) {
            const lines = content.split(/\r\n?|\n/);
            const processedLines = [];
            const sectionKeywords = /begin|stanza|chorus|verse|bridge|intro/i; // case-insensitive

            for (const line of lines) {
                const trimmedLine = line.trim();
                let processedLineHtml;
                
                if (trimmedLine === '') {
                    // Use &nbsp; for empty lines to maintain spacing with 'white-space: pre'.
                    processedLineHtml = '&nbsp;';
                } else {
                    if (sectionKeywords.test(trimmedLine)) {
                        processedLineHtml = `<span style="color: blue">${line}</span>`;
                    } else {
                        processedLineHtml = formatChordsInLine(line);
                    }
                }
                processedLines.push(`<div>${processedLineHtml}</div>`);
            }
            
            return processedLines.join('\n');
        }

        // Run the script after the DOM is loaded.
        document.addEventListener('DOMContentLoaded', () => {
            // Set the page and heading titles from the filename.
            const path = window.location.pathname;
            const filename = path.substring(path.lastIndexOf('/') + 1);
            const pageTitle = decodeURIComponent(filename.replace('.html', ''))
                .replace(/_/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2');
        
            document.title = pageTitle;
            document.getElementById('song-title').textContent = pageTitle;

            // Dynamically create the "Edit on GitHub" link.
            const editWrapper = document.querySelector('.edit-chords-wrapper');
            if (editWrapper && songChordData.editChords) {
                const editLink = document.createElement('a');
                editLink.href = songChordData.editChords.url;
                editLink.textContent = songChordData.editChords.text;
                editLink.target = '_blank';
                editLink.rel = 'noopener noreferrer';
                editWrapper.appendChild(editLink);
            }

            // Initial render of the chords.
            const container = document.getElementById('chord-sheet-container');
            if (container && songChordData.chordSheet) {
                const htmlMarkup = generateChordMarkup(songChordData.chordSheet.content);
                container.innerHTML = htmlMarkup;
            }
        });

    </script>
