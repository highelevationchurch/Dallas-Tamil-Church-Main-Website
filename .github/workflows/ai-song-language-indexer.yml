
name: AI Categorize Song Language

on:
  push:
    branches:
      - main
    paths:
      - 'all_songs_index.json'

jobs:
  categorize:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @google/genai

      - name: Run AI Song Language Indexer
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ai_song_language_indexer.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: Auto-categorize songs by language'
          file_pattern: 'ai_english_songs_index.json ai_tamil_songs_index.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
