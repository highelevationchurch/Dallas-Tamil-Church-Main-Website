            <center><h3 class="songTitle">En Ullam Devanpaul</h3></center>
        </div>
        <div>
            <p class="contentTamil">
என் உள்ளம் தேவன்பால்<br>
பொங்கி வழியுதே<br>
இயேசென்னை இரட்சித்தார்<br>
நான் ஆடிப்பாடுவேன்<br>
எவரும் அறியாரே<br>
என் உள்ளம் பொங்குதே<br>
அல்லும் பகலும் எந்தன் உள்ளம்<br>
பொங்கி வழியுதே<br>
என் உள்ளம் பொங்கி(4) வழியுதே<br>
<br>
            </p>
