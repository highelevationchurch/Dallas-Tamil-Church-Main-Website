        <div>
            <p class="contentTamil">

ஒரு தாய் தேற்றுவதுப்போல்<br>
என் நேசர் தேற்றுவார்<br>
அல்லேலூயா – 4<br>
<br>
மார்போடு அணைப்பாரே<br>
மனக்கவலை தீர்ப்பாரே<br>
<br>
கரம்பிடித்து நடத்துவார்<br>
கன்மலைமேல் நிறுத்துவார்<br>
<br>
எனக்காக மரித்தாரே<br>
என் பாவம் சுமந்தாரே<br>
<br>
ஒரு போதும் கைவிடார்<br>
ஒரு நாளும் விலகிடார்<br>
<br>


            </p>
