            <p class="contentTamil">

வாரும் தூய ஆவியே<br>
உம் பிரசன்னத்தை வாஞ்சிகிறோம்<br>
உம் வல்லமையால் என்னை நிறைத்து<br>
நீர் ஆளுகை செய்யும்<br>
<br>
ஜீவ தண்ணீர் நீரே<br>
தாகம் தீர்க்கும் ஊற்று<br>
ஆலோசனை கர்த்தரே<br>
நீர் ஆளுகை செய்யும்<br>
<br>
அக்கினியும் நீரே<br>
பெருங்காற்றும் நீரே<br>
பெருமழை போலவே<br>
ஆவியை ஊற்றும்<br>
<br>


            </p>
