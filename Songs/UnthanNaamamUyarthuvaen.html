            <p class="contentTamil">
துதிகள் பாடி மகிழ்ந்திடுவேனே<br>
எந்தன் வாழ்வில் நிறைந்தவர் நீர் மீட்க வந்தீர் மகிழ்ந்திடுவேனே<br>
<br>
பாதை காட்டிடவே பூவில் வந்திரே<br>
சிலுவை சென்றவரே நாடி வந்தேனே<br>
சாவை வென்றவரே உயிர்தெழுந்தவரே<br>
உந்தன் நாமம் உயர்த்துவேன்<br>
<br>


            </p>
