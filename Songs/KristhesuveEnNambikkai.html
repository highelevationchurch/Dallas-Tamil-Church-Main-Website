<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <style>
        .header-container { display: flex; justify-content: space-between; align-items: center;}
    </style>

    <script>
        // Note: The song title is derived automatically from this HTML file name with the script below.
        const songData = {
          "links": [
            {
              "title": "View Video",
              "url": "https://www.youtube.com/watch?v=e8cErqoPOuQ"
            },
            {
              "title": "View Chords",
              "url": "https://docs.google.com/document/d/12RXmS05Ebq83rzhoflCKUPZNVbDisjYRmrRWzPI7EwI/edit?pli=1&tab=t.0"
            },
            {
              "title": "Placeholder",
              "url": "KristhesuveEnNambikkaiPPT.pptx"
            }
          ],
          "lyrics": {
            "tamil": `
கிறிஸ்தேசுவே என் நம்பிக்கை
கீதம் வெளிச்சம் பெலனே
இம்மூலைக்கல் அசையாதே
பெருமழை புயல் காற்றிக்கும்

ஒப்பில்லாத மா அன்பதே
என் பயங்கள் நீக்கினதே
எனக்கெல்லாம் என் இயேசுவே
அவரது அன்பு போதுமே

1. கிஸ்தேசுவில் மா தேவனே
அவதரித்தார் பாலகனாய்
அன்பின் ஈவாம் இரட்சகரை
பாவமாந்தர் பகைத்தாரே

என் பாவங்கள் சுமந்தாரே
கோபக்கினை நீக்கினாரே
கல்வாரியில் மரித்தாரே
மரித்தென்னை வாழ வைத்தாரே

2. கல்லறையில் சடலமாய்
ஒளியை இருள் சூழ்ந்திட்டதே
மகிமையாய் உயிர்த்தாரே
மரணத்தை வென்றெழுந்தாரே

என் பாவத்தின் சாபங்களை
நீர் நீக்கினீர் என் இயேசுவே
உம் இரத்தத்தால் மீட்டீர் நான் உம்
சொந்தமானேன் நீரென் சொந்தம்

3. சாவின் பயம் நீக்கினதே
என்னிலுள்ள உம் வல்லமை
உம் சார்பில் நான் விழுந்தேனே
என் காலங்கள் உம் கரத்தில்

ஏதும் என்னை என்ன செய்யும்
நான் என்றுமே உம் கையிலே
விண்ணவரை சேரும்வரை
அவரது வல்லமை காக்குமே

`,
            "english": `
Kristesuvae en nambikai
Geetham velicham belanae
Immoolaikal asaiyaathae
Perumazhai puyal kaatrikum

Opilaatha maa anbathae
En payangal neekinathae
Enakellam en yesuvae
Avarathu anbu pothumae

1. Kristesuvil maa devanae
Avatharithaar palaganaai
Anbin yeevaam ratchagarai
Paavamaanthar pagaithaarae

En paavangal sumanthaarae
Kopakinai neekinaarae
Kalvariyil marithaarae
Marithennai vazha vaithaarae

2. Kallaraiyil sadalamaai
Oliyai irul soolnthithathae
Magimaiyaai uyirthaarae
Maranathai vendrulunthaarae

En pavathin sabangalai
Neer neekineer en yesuvae
Um rathathaal meter naan um
Sonthamaanaen neeren sontham

3. Saavin payam neekinathae
Ennilula um vallamai
Um saarbil naan vilunthaenae
En kalangal em karathil

Yethum ennai enna seiyum
Naan endrumae um kaiyilae
Vinnavarai serumvarai
Avarathu vallamai kaakumae

`
          }
        };

        // This script uses the 'songData' object to populate the page content.
        document.addEventListener('DOMContentLoaded', () => {
            // Set page title and heading from the filename (e.g., "MySong.html" -> "My Song")
            const path = window.location.pathname;
            const filename = path.substring(path.lastIndexOf('/') + 1);
            // Format the title: remove .html, replace underscores, and split camelCase.
            const pageTitle = decodeURIComponent(filename.replace('.html', ''))
                .replace(/_/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2');
            
            document.title = pageTitle;
            
            const headerContainer = document.getElementById('header-container');

            // Dynamically create links from the songData array
            songData.links.forEach(linkInfo => {
                const linkDiv = document.createElement('div');

                const linkElement = document.createElement('a');
                linkElement.href = linkInfo.url;
                linkElement.textContent = linkInfo.title;
                linkElement.className = 'downloadPptSong';

                // Open external links in a new tab
                if (linkInfo.url.startsWith('http')) {
                    linkElement.target = '_blank';
                }

                linkDiv.appendChild(linkElement);
                headerContainer.appendChild(linkDiv);
            });
            
            const titleElement = document.createElement('h3');
            titleElement.id = 'song-title';
            titleElement.className = 'songTitle';
            titleElement.textContent = pageTitle;

            const centerWrapper = document.createElement('center');
            centerWrapper.appendChild(titleElement);
            headerContainer.after(centerWrapper);
            
            // Using template literals allows for multiline strings. We replace the newline characters with <br> tags for HTML rendering.
            document.getElementById('tamil-lyrics').innerHTML = songData.lyrics.tamil.replace(/\n/g, '<br>');
            document.getElementById('english-lyrics').innerHTML = songData.lyrics.english.replace(/\n/g, '<br>');
        });
    </script>
</head>

<body>
    <div class="contentWrapper">
        <div id="header-container" class="header-container">
            <!-- Links will be dynamically inserted here -->
        </div>
        <div>
            <p id="tamil-lyrics" class="contentTamil"></p>
            <p id="english-lyrics" class="contentEnglish"></p>
        </div>
    </div>
</body>
</html>
