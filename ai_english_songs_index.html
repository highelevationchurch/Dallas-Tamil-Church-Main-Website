<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI English Songs Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:700,400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="menu-bar-placeholder"></div>

<div class="container-fluid main">
    <div class="row">
        <div class="col-lg-12">
            <div class="center-block">
                <h2>Auto English Songs Index</h2>
                <p>
                  <button class="btn btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNoteEnglish" aria-expanded="false" aria-controls="collapseNoteEnglish">
                    Note
                  </button>
                </p>
                <div class="collapse" id="collapseNoteEnglish">
                  <div class="card card-body">
                    This index automatically includes all files scripted and uses AI for language detection.
                  </div>
                </div>
                <div id="song-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    // Event delegation for dynamically loaded submenu toggles
    document.addEventListener('click', function(e) {
        const toggle = e.target.closest('.dropdown-submenu a.dropdown-toggle');
        if (toggle) {
            e.preventDefault();
            e.stopPropagation();
            let submenu = toggle.nextElementSibling;
            if (submenu) {
                submenu.classList.toggle('show');
            }
        }

        // Close submenus when clicking outside
        // Check if the clicked element is inside a dropdown or dropdown-menu
        let isClickInsideDropdown = e.target.closest('.dropdown') || e.target.closest('.dropdown-menu') || e.target.closest('.dropdown-submenu');

        if (!isClickInsideDropdown) {
            document.querySelectorAll('.dropdown-submenu .dropdown-menu.show').forEach(function(submenu) {
                submenu.classList.remove('show');
                submenu.parentNode.classList.remove('show');
            });
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Fetch and insert menu bar
        fetch('../menu_bar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-bar-placeholder').innerHTML = data;
            });

        // Fetch and insert footer
        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        // Fetch and process song list
        // The song titles are generated from the filenames in the JSON file.
        fetch('../ai_english_songs_index.json')
            .then(response => response.json())
            .then(data => {
                const songListContainer = document.getElementById('song-list');
                const songsByLetter = {};

                data.forEach(fileName => {
                    const title = fileName.replace('.html', '').replace(/_/g, ' ');
                    const firstLetter = title.charAt(0).toUpperCase();
                    if (!songsByLetter[firstLetter]) {
                        songsByLetter[firstLetter] = [];
                    }
                    songsByLetter[firstLetter].push({ title, fileName });
                });

                const sortedLetters = Object.keys(songsByLetter).sort();

                let html = '';
                sortedLetters.forEach(letter => {
                    html += `<h3>${letter}</h3><ul>`;
                    songsByLetter[letter].forEach(song => {
                        html += `<li><a href="../Songs/${song.fileName}" target="_blank">${song.title}</a></li>`;
                    });
                    html += `</ul>`;
                });

                songListContainer.innerHTML = html;
            });
    });
</script>

<script src="../js/main.js"></script>
</body>
</html>
